# --- Bluetooth ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="nice60"
CONFIG_BT_MAX_CONN=1

# --- ZMK BLE ---
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_KEYBOARD=y
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y

# --- Power ---
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# --- Logging opcional ---
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_INF=y
